# Student x2 Training Configuration
# Purpose: Isolated configuration for Student x2 Super-Resolution model training

experiment_name: "student_x2"
output_dir: "outputs"

# Target model specifications (Scale = 2)
model:
  type: "student"
  name: "student_rfdb_x2"
  num_blocks: 3
  num_rfdb_blocks: 3
  num_channels: 48
  distilled_channels: 24
  scale: 2
  in_channels: 3
  out_channels: 3
  kernel_size: 3
  padding: 1
  stride: 1
  bias: true
  activation: "leaky_relu"
  negative_slope: 0.05
  initial_residual_scale: 1.0

# Teacher Model specifications for x2 training (SwinIR x2 teacher)
teacher:
  enable: false
  name: "swinir_x2"
  checkpoint_path: null
  scale: 2
  in_channels: 3

# Input datasets paths and data loading setup
dataset:
  name: "DIV2K"
  train_hr_path: "datasets/DIV2K/DIV2K_train_HR"
  train_lr_path: null
  val_datasets:
    Set5: "datasets/Set5"
    Set14: "datasets/Set14"
  patch_size: 192
  batch_size: 16
  num_workers: 4

# Degradation parameters for dynamic LR generation (2x scale)
degradation:
  blur_kernel: 21
  blur_sigma: 1.2
  noise_std: 0.0
  jpeg_quality: 100

# Loss weights configuration
distillation:
  enable: false
  alpha_pixel: 1.0
  beta_feature: 0.0
  distill_loss_type: "l1"

# Training parameters and learning rate schedule
training:
  epochs: 100
  lr: 0.0001
  lr_milestones:
    - 50
    - 80
  lr_gamma: 0.5
  optimizer: "Adam"
  weight_decay: 0.0
  seed: 42

# Validation loops configurations
evaluation:
  metrics:
    - "psnr"
    - "ssim"
  save_sample_interval: 10
  evaluate_only: false
