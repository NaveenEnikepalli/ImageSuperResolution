# Optimizer and schedule templates

standard:
  epochs: 300
  lr: 0.0001
  lr_milestones:
    - 150
    - 250
  lr_gamma: 0.5
  optimizer: "Adam"
  weight_decay: 0.0
  seed: 42

debug:
  epochs: 5
  lr: 0.001
  lr_milestones:
    - 2
    - 4
  lr_gamma: 0.1
  optimizer: "Adam"
  weight_decay: 0.0
  seed: 42
