# Phase 4A Experiment Configuration Template
# Student Architectural Variant (Residual Scaling / Capacity Change)

experiment_name: "exp03_residual_scaling_student"
description: "Explore student model capacity change by scaling residual blocks and feature channels."

random_seed: 42
checkpoint_directory: "outputs/runs/exp03_residual_scaling_student/checkpoints"

# Input dataset paths and settings
dataset:
  name: "DIV2K"
  train_hr_path: "datasets/DIV2K/DIV2K_train_HR"
  patch_size: 128
  batch_size: 16
  num_workers: 4

# Optimization configurations
epochs: 100
learning_rate: 0.0001
optimizer:
  type: "Adam"
  weight_decay: 1e-4
scheduler:
  type: "MultiStepLR"
  milestones: [50, 80]
  gamma: 0.5

# Loss function parameters
losses:
  pixel_loss: "charbonnier"

# Student model parameters (Capacity scaled up)
student:
  name: "edsr_medium"
  num_blocks: 8                 # Increased from 6
  num_channels: 48              # Increased from 32
  scale: 4

# Teacher model parameters (disabled for baseline comparison)
teacher:
  enable: false

# Validation metrics
metrics:
  - "psnr"
  - "ssim"

notes: >
  Ablation test evaluating whether adding capacity (8 blocks / 48 channels) to student
  without distillation matches or exceeds a 6 block / 32 channel distilled student.
